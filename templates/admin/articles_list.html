<!DOCTYPE html>
<html>
<head>
    <title>Articles</title>
</head>
<body>
    <h1>Articles</h1>
    <p><a href="{% url 'admin_article_create' %}">Create article</a></p>
    <ul>
        {% for article in articles %}
            <li>{{ article.title }} - <a href="{% url 'admin_article_edit' article.id %}">Edit</a></li>
        {% empty %}
            <li>No articles</li>
        {% endfor %}
    </ul>
</body>
</html>
