<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>
</head>
<body>
    <h1>Categories</h1>
    <p><a href="{% url 'admin_category_create' %}">Create category</a></p>
    <ul>
        {% for category in categories %}
            <li>{{ category.name }} - <a href="{% url 'admin_category_edit' category.id %}">Edit</a></li>
        {% empty %}
            <li>No categories</li>
        {% endfor %}
    </ul>
</body>
</html>
