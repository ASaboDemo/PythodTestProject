<!DOCTYPE html>
<html>
<head>
    <title>{{ album.title }}</title>
</head>
<body>
    <h1>{{ album.title }}</h1>
    <p><a href="{% url 'gallery' %}">Back to gallery</a></p>
    {% if photos %}
        <ul>
            {% for photo in photos %}
                <li>
                    {% if photo.image %}
                        <img src="{{ photo.image.url }}" alt="{{ photo.title }}" style="max-width:300px; display:block; margin-bottom:12px;" />
                    {% endif %}
                    {{ photo.title }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No photos in this album.</p>
    {% endif %}
</body>
</html>
